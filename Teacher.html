<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
  body{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:#f8fafc;color:#0f172a}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.hidden{display:none!important}textarea{resize:vertical}
  </style>
</head>
<body>
  <header class="bg-slate-900 text-white">
    <div class="max-w-7xl mx-auto p-5 flex flex-wrap justify-between gap-3">
      <div><b class="text-emerald-300">교사용 대시보드</b><h1 class="text-2xl font-black">🌱 Mendel's Lab 학습 분석</h1></div>
      <div class="flex gap-2"><input id="key" type="password" class="text-slate-900 rounded-xl px-3" placeholder="교사용 접근 키"><button id="load" class="bg-emerald-500 text-slate-950 font-black px-4 rounded-xl">불러오기</button></div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto p-4">
    <p id="status" class="text-sm text-slate-500 mb-4">접근 키를 입력하세요.</p>
    <section class="grid grid-cols-2 md:grid-cols-5 gap-3">
      <div class="card p-4">제출 수<p id="subs" class="text-3xl font-black">0</p></div>
      <div class="card p-4">학생 수<p id="students" class="text-3xl font-black">0</p></div>
      <div class="card p-4">누적 교배<p id="trials" class="text-3xl font-black">0</p></div>
      <div class="card p-4">심화/기본/기초<p id="levels" class="text-xl font-black">0/0/0</p></div>
      <div class="card p-4">검토 완료<p id="reviewed" class="text-3xl font-black">0</p></div>
    </section>
    <section class="grid lg:grid-cols-3 gap-5 mt-5">
      <div class="card p-5"><h2 class="font-black">성취 수준 분포</h2><div class="h-64"><canvas id="chart"></canvas></div></div>
      <div class="card p-5 lg:col-span-2">
        <div class="flex justify-between gap-2"><h2 class="font-black">제출 목록</h2><input id="search" class="border rounded-xl px-3" placeholder="학생 번호 검색"></div>
        <div id="rows" class="space-y-3 mt-4 max-h-[650px] overflow-auto"></div>
      </div>
    </section>
  </main>
  <dialog id="dialog" class="rounded-3xl p-0 w-[min(760px,94vw)]">
    <div class="p-6">
      <button class="float-right text-2xl" onclick="dialog.close()">×</button>
      <h3 class="text-xl font-black">제출 상세</h3>
      <div id="detail" class="mt-4 space-y-3 text-sm"></div>
      <select id="rlevel" class="border rounded-xl p-3 mt-4"><option>심화</option><option>기본</option><option>기초</option></select>
      <select id="rstatus" class="border rounded-xl p-3 mt-4"><option>교사검토완료</option><option>재작성요청</option><option>제출</option></select>
      <textarea id="rfb" class="w-full border rounded-xl p-3 mt-3" rows="4" placeholder="학생 피드백"></textarea>
      <textarea id="rnote" class="w-full border rounded-xl p-3 mt-3" rows="3" placeholder="교사 메모"></textarea>
      <button id="save" class="float-right bg-emerald-700 text-white font-black px-5 py-3 rounded-xl mt-3">검토 저장</button>
      <div class="clear-both"></div>
    </div>
  </dialog>
  <script>
  let rows=[],current=null,chart;const $=id=>document.getElementById(id);const gas=(fn,args=[])=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function load(){if(!$('key').value)return alert('접근 키를 입력하세요.');localStorage.setItem('mendelKey',$('key').value);$('status').textContent='불러오는 중…';try{const r=await gas('getDashboardData',[$('key').value]);rows=r.rows;const s=r.summary;$('subs').textContent=s.submissions;$('students').textContent=s.students;$('trials').textContent=Number(s.trials).toLocaleString();$('levels').textContent=`${s.levels.심화}/${s.levels.기본}/${s.levels.기초}`;$('reviewed').textContent=s.reviewed;draw([s.levels.심화,s.levels.기본,s.levels.기초,s.levels.미채점]);render();$('status').textContent='최근 갱신: '+new Date(r.updatedAt).toLocaleString();}catch(e){$('status').textContent='오류: '+(e.message||e);}}
  function draw(v){if(chart){chart.data.datasets[0].data=v;chart.update();return;}chart=new Chart($('chart'),{type:'doughnut',data:{labels:['심화','기본','기초','미채점'],datasets:[{data:v,backgroundColor:['#059669','#2563eb','#f59e0b','#cbd5e1']}]},options:{responsive:true,maintainAspectRatio:false}})}
  function render(){const q=$('search').value.trim();const a=rows.filter(r=>!q||r['학생코드'].includes(q));$('rows').innerHTML=a.map(r=>`<button class="w-full text-left border rounded-2xl p-4 hover:bg-slate-50" onclick="openRow('${esc(r['기록ID'])}')"><div class="flex justify-between gap-3"><div><b>${esc(r['학생코드'])} · ${esc(r['모둠'])}</b><p class="text-xs text-violet-700 font-bold">${esc(r['탐구형질']||'씨의 모양')}</p></div><span>${esc(r['성취수준']||'미채점')}</span></div><p class="text-xs text-slate-500">${esc(r['제출시각'])} · ${esc(r['전체'])}회 · ${esc(r['관찰비율'])}</p><p class="mt-2 text-sm">${esc(r['문항2답안']).slice(0,160)}</p></button>`).join('')||'<p class="text-center text-slate-500 py-10">제출이 없습니다.</p>';}
  function openRow(id){current=rows.find(r=>r['기록ID']===id);const dl=current['우성표현형']||'둥근 씨',rl=current['열성표현형']||'주름진 씨';$('detail').innerHTML=`<p><b>선택한 탐구 형질</b><br>${esc(current['탐구형질']||'씨의 모양')} · ${esc(dl)} / ${esc(rl)}</p><p><b>형질 다양성 원인에 대한 사전 예상</b><br>${esc(current['형질다양성예상']||'미기록')}</p><p><b>탐구 질문</b><br>${esc(current['궁금한점'])}</p><p><b>가설</b><br>${esc(current['가설'])}</p><p><b>결과</b><br>${esc(dl)} ${esc(current['둥근'])}, ${esc(rl)} ${esc(current['주름진'])}, ${esc(current['관찰비율'])}</p><p><b>문항1</b><br>${esc(current['문항1답안'])}</p><p><b>문항2</b><br>${esc(current['문항2답안'])}</p>`;$('rlevel').value=current['성취수준']||'기초';$('rstatus').value=current['상태']||'교사검토완료';$('rfb').value=current['AI피드백']||'';$('rnote').value=current['교사메모']||'';$('dialog').showModal();}
  $('save').onclick=async()=>{await gas('updateTeacherReview',[$('key').value,current['기록ID'],{level:$('rlevel').value,status:$('rstatus').value,feedback:$('rfb').value,note:$('rnote').value}]);$('dialog').close();load();};$('load').onclick=load;$('search').oninput=render;$('key').value=localStorage.getItem('mendelKey')||'';if($('key').value)load();
  </script>
</body>
</html>
