<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>멘델의 유전 법칙 탐구 실험실</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .tab-nav { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; }
    .tab-btn { padding: 12px 24px; border: none; background: none; font-size: 16px; font-weight: bold; color: #666; cursor: pointer; }
    .tab-btn.active { color: #2b6cb0; border-bottom: 3px solid #2b6cb0; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: #fafafa; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; margin-bottom: 15px; }
    .btn { background: #3182ce; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #2b6cb0; }
    .btn:disabled { background: #cbd5e0; cursor: not-allowed; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #2d3748; color: white; padding: 12px 20px; border-radius: 6px; display: none; z-index: 1000; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🧬 멘델의 유전 법칙 탐구 실험실</h2>

    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab(1)">1. 형질 선택 및 가설</button>
      <button class="tab-btn" onclick="switchTab(2)">2. F₁ 교배 실험</button>
      <button class="tab-btn" onclick="switchTab(3)">3. F₂ 자가교배 및 분석</button>
    </div>

    <!-- 1단계 -->
    <div id="section1" class="section active">
      <div class="card">
        <h3>탐구할 대립형질 선택</h3>
        <select id="traitSelect" onchange="state.trait = this.value">
          <option value="씨앗 모양">씨앗 모양 (둥근 R / 주름진 r)</option>
          <option value="씨앗 색깔">씨앗 색깔 (황색 Y / 초록색 y)</option>
          <option value="꽃 색깔">꽃 색깔 (보라색 P / 흰색 p)</option>
        </select>
      </div>
      <div class="card">
        <h3>가설 설정</h3>
        <textarea id="hypothesis" style="width: 100%; height: 80px;" placeholder="예: F1에서는 우성 형질만 나타나고, F2에서는 3:1 비율로 나타날 것이다."></textarea>
      </div>
      <button class="btn" onclick="saveStep1()">다음 단계로 (F₁ 실험)</button>
    </div>

    <!-- 2단계 -->
    <div id="section2" class="section">
      <div class="card">
        <h3>F₁ 잡종 1세대 교배</h3>
        <button class="btn" onclick="runF1Experiment()">F₁ 교배 실행</button>
        <div id="f1Result" style="margin-top: 15px; font-weight: bold;"></div>
      </div>
      <button class="btn" onclick="saveStep2()">다음 단계로 (F₂ 실험)</button>
    </div>

    <!-- 3단계 -->
    <div id="section3" class="section">
      <div class="card">
        <h3>F₂ 자가교배 실험 (대량 표본)</h3>
        <div>
          <button class="btn" onclick="runF2Experiment(1)">1회</button>
          <button class="btn" onclick="runF2Experiment(10)">10회</button>
          <button class="btn" onclick="runF2Experiment(100)">100회</button>
          <button class="btn" onclick="runF2Experiment(500)">500회</button>
        </div>
        <div style="margin-top: 20px;">
          <canvas id="f2Chart" width="400" height="200"></canvas>
        </div>
      </div>

      <div class="card">
        <h3>탐구 결과 분석 및 결론 제출</h3>
        <textarea id="finalConclusion" style="width: 100%; height: 100px;" placeholder="실험 결과 및 표본 크기에 따른 비율 변화를 포함하여 결론을 작성하세요."></textarea>
      </div>
      <button class="btn" id="submitBtn" onclick="submitResult()">최종 결과 제출 및 AI 평가</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ⚠️ 배포된 Cloud Function URL로 변경하세요.
    const FUNCTION_URL = "https://us-central1-mendel-lab.cloudfunctions.net/submitAndEvaluate";

    const state = {
      trait: '씨앗 모양',
      hypothesis: '',
      f1Done: false,
      f2Count: 0,
      f2Dominant: 0,
      f2Recessive: 0
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function switchTab(step) {
      if (step === 2 && !state.hypothesis.trim()) return alert('가설을 작성하세요.');
      if (step === 3 && !state.f1Done) return alert('F₁ 교배를 먼저 진행하세요.');

      document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('section' + step).classList.add('active');
      document.querySelectorAll('.tab-btn')[step - 1].classList.add('active');
    }

    function saveStep1() {
      state.hypothesis = document.getElementById('hypothesis').value;
      if (!state.hypothesis.trim()) return alert('가설을 입력하세요.');
      switchTab(2);
    }

    function runF1Experiment() {
      state.f1Done = true;
      document.getElementById('f1Result').innerText = `[결론] F₁ 세대 결과: 모든 개체에서 우성 형질만 발현되었습니다.`;
      showToast('F₁ 교배 완료');
    }

    function saveStep2() {
      if (!state.f1Done) return alert('F₁ 교배를 진행하세요.');
      switchTab(3);
    }

    let chartInstance = null;
    function runF2Experiment(count) {
      for (let i = 0; i < count; i++) {
        Math.random() < 0.75 ? state.f2Dominant++ : state.f2Recessive++;
      }
      state.f2Count += count;
      
      const ctx = document.getElementById('f2Chart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['우성 표현형', '열성 표현형'],
          datasets: [{ label: `총 개체 수 (${state.f2Count}회)`, data: [state.f2Dominant, state.f2Recessive], backgroundColor: ['#4299e1', '#f6ad55'] }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
      });
    }

    // Cloud Function을 통해 안전하게 AI 평가 및 저장 수행
    async function submitResult() {
      const conclusion = document.getElementById('finalConclusion').value;
      if (!conclusion.trim()) return alert('결론 분석을 작성하세요.');

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '안전하게 제출 및 평가 중...';

      const payload = {
        trait: state.trait,
        hypothesis: state.hypothesis,
        f2TotalCount: state.f2Count,
        f2Dominant: state.f2Dominant,
        f2Recessive: state.f2Recessive,
        conclusion: conclusion
      };

      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          alert(`제출 완료!\n\n[AI 평가 결과]\n- 달성 수준: ${result.level}\n- 피드백: ${result.feedback}`);
          showToast('제출이 완료되었습니다.');
        } else {
          throw new Error(result.error || '제출 처리 중 오류 발생');
        }
      } catch (e) {
        console.error(e);
        alert('오류 발생: ' + e.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '최종 결과 제출 및 AI 평가';
      }
    }
  </script>
</body>
</html>
